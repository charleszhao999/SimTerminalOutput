<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimTerminalOutput - 模拟终端输出图片生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: #2d3748;
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #cbd5e0;
            font-size: 14px;
        }
        
        .content {
            padding: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
        }
        
        .input-group textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .input-group input[type="number"] {
            width: 200px;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .input-group input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .input-group input[type="color"] {
            width: 200px;
            height: 45px;
            padding: 5px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        .input-group input[type="color"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            background-color: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #48bb78;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }
        
        .output {
            margin-top: 30px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 6px;
            border: 2px dashed #e2e8f0;
        }
        
        .output h3 {
            margin-bottom: 15px;
            color: #2d3748;
        }
        
        #previewCanvas {
            max-width: 100%;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            background: #000;
        }
        
        .info {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 4px;
            font-size: 12px;
            color: #718096;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ SimTerminalOutput</h1>
            <p>模拟终端输出图片生成器 - 输入文字，生成黑底白字的终端风格图片</p>
        </div>
        
        <div class="content">
            <div class="input-group">
                <label for="textInput">输入文字内容:</label>
                <textarea id="textInput" placeholder="请输入要显示在终端中的文字内容...&#10;支持多行文本&#10;例如：&#10;$ npm install&#10;$ npm start&#10;Server running on port 3000..."></textarea>
            </div>
            
            <div class="settings">
                <div class="input-group">
                    <label for="widthInput">图片宽度 (像素):</label>
                    <input type="number" id="widthInput" value="800" min="200" max="2000" step="50">
                </div>
                
                <div class="input-group">
                    <label for="fontSizeInput">字体大小 (像素):</label>
                    <input type="number" id="fontSizeInput" value="16" min="10" max="32" step="1">
                </div>
                
                <div class="input-group">
                    <label for="paddingInput">内边距 (像素):</label>
                    <input type="number" id="paddingInput" value="20" min="0" max="100" step="5">
                </div>
            </div>
            
            <div class="settings">
                <div class="input-group">
                    <label for="bgColorInput">背景颜色:</label>
                    <input type="color" id="bgColorInput" value="#000000">
                </div>
                
                <div class="input-group">
                    <label for="textColorInput">文字颜色:</label>
                    <input type="color" id="textColorInput" value="#FFFFFF">
                </div>
            </div>
            
            <div class="settings">
                <div class="input-group">
                    <label for="fontEnglishInput">英文字体:</label>
                    <select id="fontEnglishInput">
                        <option value="Cascadia Mono">Cascadia Mono</option>
                        <option value="Consolas">Consolas</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Monaco">Monaco</option>
                        <option value="Menlo">Menlo</option>
                        <option value="Source Code Pro">Source Code Pro</option>
                        <option value="Fira Code">Fira Code</option>
                        <option value="JetBrains Mono">JetBrains Mono</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="fontChineseInput">中文字体:</label>
                    <select id="fontChineseInput">
                        <option value="Microsoft YaHei">微软雅黑 (Microsoft YaHei)</option>
                        <option value="SimHei">黑体 (SimHei)</option>
                        <option value="SimSun">宋体 (SimSun)</option>
                        <option value="KaiTi">楷体 (KaiTi)</option>
                        <option value="FangSong">仿宋 (FangSong)</option>
                        <option value="PingFang SC">苹方 (PingFang SC)</option>
                        <option value="Noto Sans SC">Noto Sans SC</option>
                    </select>
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-secondary" onclick="downloadImage()" id="downloadBtn">下载图片</button>
            </div>
            
            <div class="output" id="outputSection">
                <h3>预览:</h3>
                <canvas id="previewCanvas"></canvas>
                <div class="info" id="imageInfo"></div>
            </div>
        </div>
    </div>
    
    <script src="terminal-generator.js"></script>
</body>
</html>
